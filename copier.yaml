---
#
# https://copier.readthedocs.io/
#
# use the command `pdm run copier update` to update the template data
#

# copier config settings
# <https://copier.readthedocs.io/en/stable/configuring/>

# tune Jinja templating engine
# https://jinja.palletsprojects.com/en/3.1.x/api/#jinja2.Environment
_envops:
  keep_trailing_newline: true
  lstrip_blocks: true
  trim_blocks: true

_exclude:
  # patterns using _copier_operation allows to have files that are rendered
  # once during copy, but are never updated
  - "{% if _copier_operation == 'update' -%}template/.github/CODEOWNERS{% endif %}"
  - "{% if _copier_operation == 'update' -%}{{package_namespace}}/{{package_name}}/*.py{% endif %}"
  - "{% if _copier_operation == 'update' -%}tests/*.py{% endif %}"
  - "{% if _copier_operation == 'update' -%}CONTRIBUTING.md{% endif %}"
  - "{% if _copier_operation == 'update' -%}README.md{% endif %}"
  - "{% if _copier_operation == 'update' -%}.release-please-manifest.json{% endif %}"
  - "{% if _copier_operation == 'update' -%}cspell.config.yaml{% endif %}"
  - "{% if _copier_operation == 'update' -%}pyproject.toml{% endif %}"
  - "{% if _copier_operation == 'update' -%}uv.lock{% endif %}"

_message_after_copy: |
  ----------------------------------------------------------------------------
  Your Python package "{{ package_namespace }}.{{ package_name }}" is ready!
  ----------------------------------------------------------------------------
  Next steps:

    1. change directory to the project root
    2. read "docs/CONTRIBUTING.md"
    3. start coding and testing

    cd {{ _copier_conf.dst_path }}
    uv run pytest
    tox

_subdirectory: template

_tasks:
  - command: if [ ! -e .git ] ; then git init ; fi
  - command: pre-commit install
  - command: uv sync --no-progress

# template variables

package_namespace:
  help: "package namespace (e.g. your name, team or organization)"
  type: str
  validator: >-
    {% if not (package_namespace | regex_search('^[a-z][a-z0-9]+$')) %}
    package_namespace should be a short, memorable, alphanumeric term

    will be used as `import <package_namespace>.<package_name>`
    {% endif %}

package_name:
  help: "package name"
  type: str
  validator: >-
    {% if not (package_name | regex_search('^[a-z][a-z0-9_]+$')) %}
    package_name should be a short, memorable, alphanumeric term

    will be used as `import <package_namespace>.<package_name>`
    {% endif %}

package_description:
  placeholder: "do something magical"
  help: "a suitable package description, e.g. 'do something magical'"
  type: str

author_name:
  place_holder: John Doe
  help: "author name, e.g. 'John Doe'"
  type: str

author_email:
  place_holder: john_doe@example.invalid
  type: str
  help: "author email, e.g. 'john_doe@example.invalid'"

repository_owner:
  default: "{{ package_namespace }}"
  type: str
  help: "repository owner"

repository_name:
  default: "lib{{ package_name.replace('_', '-') }}-python"
  type: str
  help: "repository name"

repository_url:
  default: "https://github.com/{{ repository_owner }}/{{ repository_name }}"
  type: str
  help: "The repository's URL, e.g. 'https://github.com/<org>/<repo>'"

issuetracker_url:
  default: "https://github.com/{{ package_namespace }}/{{ repository_name }}/issues"
  type: str
  help: "The project's issue tracker URL, e.g. 'https://github.com/<org>/<repo>/issues'"

default_branch:
  default: "main"
  type: str
  help: "default branch"

python_constraint:
  default: ">=3.10,<3.13"
  type: str
  help: "Python version constraint"

max_line_length:
  default: 120
  type: int
  help: "Define the maximum allowed line length."

is_typed:
  default: true
  type: bool
  help: "This package provides type hints."
